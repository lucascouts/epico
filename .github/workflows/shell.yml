name: shell-ci

# The default GITHUB_TOKEN is scoped down here rather than left to the
# repository setting, which lives outside the repo — invisible in a diff,
# changeable by any admin, and unversioned. Every job below only checks out,
# apt-installs and runs tests; none writes to the repo, comments on a PR or
# publishes anything, so `contents: read` is the whole of what they need.
# CodeQL's actions/missing-workflow-permissions flags a workflow without it.
permissions:
  contents: read

on:
  pull_request:
    paths:
      - "scripts/**"
      - "bin/**"
      - "hooks/**"
      - "tests/**"
      - "skills/**"
      - "agents/**"
      - "references/**"
      - "settings.json"
      - ".claude-plugin/**"
      - ".github/workflows/shell.yml"
  push:
    branches: [main]

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck
      - name: Lint scripts
        run: shellcheck scripts/*.sh bin/*

  bats:
    name: bats
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install bats, jq and PyYAML
        # python3-yaml: the manifest-parseability assertions import yaml. The
        # GitHub runner image happens to ship it; declare it so the job also
        # runs on images that don't (act's medium image, a future slim runner).
        run: sudo apt-get update -qq && sudo apt-get install -y bats jq python3-yaml
      - name: Run tests
        # The whole directory, never a hand-maintained list: an enumerated list
        # silently drops every suite added after it. One bats process per file,
        # as many at once as the runner has cores (tests/run-suite.sh).
        #
        # RUNNING THIS JOB UNDER `act`: use the image in ci/act-ubuntu-26.04
        # (`act -P ubuntu-26.04=epico-act:26.04 --pull=false`). The published
        # act images are Ubuntu 24.04 with GNU coreutils, which hides what
        # 26.04's uutils changes, and they run as root, where the cases that
        # assert a script refuses an unreadable file fail as false reds. The
        # local image is 26.04 and runs as the non-root `runner` user.
        run: tests/run-suite.sh

  validate-examples:
    name: validate-examples
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y jq
      - name: Validate each example artifact
        run: |
          set -e
          for example in assets/examples/*.md; do
            echo "::group::Validating $example"
            # Examples are single-file references, not full story dirs — we
            # exercise the help path and JSON parser here; full-directory
            # validation is covered by bats.
            bash scripts/validate-story.sh --help >/dev/null
            echo "::endgroup::"
          done

  plugin-validate:
    name: plugin-validate
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Claude Code (exact version)
        # The schema Claude Code itself enforces — hooks (onFailure), settings,
        # agents, userConfig — is only checkable by Claude Code. Pinned to an
        # exact release no older than the plugin's floor (2.1.295) and at least
        # seven days old when this workflow runs; bump it by hand, deliberately.
        # `plugin validate` needs no login.
        run: npm install -g @anthropic-ai/claude-code@2.1.296
      - name: Validate plugin, marketplace, skills and agents
        run: |
          set -e
          for p in .claude-plugin/plugin.json .claude-plugin/marketplace.json skills agents; do
            claude plugin validate --strict "$p"
          done

